
## `docker/jellyfin/compose.yaml`

Use a portable version rather than putting your username or LAN IP in GitHub:

```yaml
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "1000:1000"

    ports:
      - "8096:8096"

    volumes:
      - ./config:/config
      - ./cache:/cache
      - ./media:/media

    restart: unless-stopped
